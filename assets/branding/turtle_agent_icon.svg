<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgv3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF8FF"/>
    </linearGradient>
    <clipPath id="squircle">
      <!-- macOS-style superellipse (squircle), approximated with cubic beziers -->
      <path d="M100,4
               C169,4 196,31 196,100
               C196,169 169,196 100,196
               C31,196 4,169 4,100
               C4,31 31,4 100,4 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- background -->
    <rect x="0" y="0" width="200" height="200" fill="url(#bgv3)"/>
    <rect x="0" y="0" width="200" height="200" fill="none" stroke="#BFE3FA" stroke-width="2"/>

    <!-- scattered background fragments -->
    <g opacity="0.55">
      <polygon points="24,42 34,36 38,48 27,53" fill="#7DD3FC"/>
      <polygon points="168,50 178,46 180,58 170,62" fill="#FDBA74"/>
      <polygon points="20,150 30,144 33,156 22,160" fill="#FDBA74"/>
      <polygon points="172,148 182,144 184,156 174,160" fill="#7DD3FC"/>
      <circle cx="30" cy="104" r="4" fill="#7DD3FC"/>
      <circle cx="170" cy="104" r="4" fill="#FDBA74"/>
      <circle cx="100" cy="18" r="3.5" fill="#FDBA74"/>
    </g>

    <!-- legs -->
    <g>
      <polygon points="46,152 60,146 66,158 56,168 44,164" fill="#FDBA74"/>
      <polygon points="134,158 144,164 156,158 150,146 138,146" fill="#7DD3FC"/>
      <polygon points="38,110 50,104 58,114 50,124 40,120" fill="#7DD3FC"/>
      <polygon points="142,114 152,104 162,110 160,122 148,124" fill="#FDBA74"/>
    </g>

    <!-- tail -->
    <polygon points="100,168 112,178 106,188 96,182" fill="#FDBA74"/>

    <!-- head: replaced with a quant / market element — an upward candlestick trend
         inside a rounded plate, in place of the turtle's face -->
    <g>
      <polygon points="100,32 114,38 118,52 112,64 100,68 88,64 82,52 86,38" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- mini candlestick chart, trending up -->
      <g stroke-linecap="round">
        <line x1="88" y1="44" x2="88" y2="60" stroke="#FB923C" stroke-width="1.6"/>
        <rect x="85.5" y="50" width="5" height="7" fill="#FB923C"/>

        <line x1="95" y1="38" x2="95" y2="58" stroke="#38BDF8" stroke-width="1.6"/>
        <rect x="92.5" y="42" width="5" height="9" fill="#38BDF8"/>

        <line x1="102" y1="34" x2="102" y2="54" stroke="#FB923C" stroke-width="1.6"/>
        <rect x="99.5" y="38" width="5" height="9" fill="#FB923C"/>

        <line x1="109" y1="30" x2="109" y2="48" stroke="#38BDF8" stroke-width="1.6"/>
        <rect x="106.5" y="33" width="5" height="9" fill="#38BDF8"/>
      </g>
      <!-- trend line across the candles -->
      <polyline points="85,58 92,50 99,44 106,36" fill="none" stroke="#0F172A" stroke-width="1.4" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- shell: fragmented mosaic, same as before -->
    <g stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round">
      <polygon points="100,76 122,84 126,104 108,116 92,116 74,104 78,84" fill="#FB923C"/>
      <polygon points="100,76 108,116 92,116" fill="#FDBA74" opacity="0.9"/>
      <polygon points="126,104 148,100 152,120 134,132 108,116" fill="#7DD3FC"/>
      <polygon points="74,104 52,100 48,120 66,132 92,116" fill="#38BDF8"/>
      <polygon points="108,116 134,132 128,152 100,160 92,116" fill="#FDBA74"/>
      <polygon points="92,116 100,160 72,152 66,132" fill="#FB923C"/>
      <polygon points="100,160 128,152 118,170 100,176 84,170" fill="#7DD3FC"/>
    </g>

    <!-- detached drifting chips -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round">
      <polygon points="150,84 160,80 163,90 154,94" fill="#7DD3FC" opacity="0.85"/>
      <polygon points="46,84 56,80 59,90 50,94" fill="#FDBA74" opacity="0.85"/>
      <polygon points="118,170 126,180 116,184 110,176" fill="#38BDF8" opacity="0.8"/>
    </g>
  </g>
</svg>
