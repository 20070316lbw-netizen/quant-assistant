[project]
name = "quant-assistant"
version = "0.1.0.dev0"
description = "本地量化研究助手的 Python MCP 开发环境"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "liudb",
    "sources",
    "minibacktest",
    "mcp>=1,<2",
]

[tool.uv]
package = false

# 三个依赖都从 GitHub 拉(跟 minibacktest 自己 pyproject 里的来源一致, 不会冲突)。
# 版本锁在 uv.lock 的具体 commit 上; 上游有新提交后用
# `uv lock --upgrade-package <名字>` 再 `uv sync` 更新。
[tool.uv.sources]
liudb = { git = "https://github.com/20070316lbw-netizen/liudb.git" }
sources = { git = "https://github.com/20070316lbw-netizen/sources.git" }
minibacktest = { git = "https://github.com/20070316lbw-netizen/minibacktest.git" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
# package = false 没有把项目装成可导入的包，靠这个把仓库根目录（放 mcp_server.py
# 的地方）加进 sys.path，测试里才能 `from mcp_server import query_prices_impl`。
pythonpath = ["."]
